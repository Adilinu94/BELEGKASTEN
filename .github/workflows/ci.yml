name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android (Tests, Build, Offline-Garantie)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Gradle-Wrapper prüfen
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      # Kernversprechen "kein Netzwerk": Das Quell-Manifest hat kein INTERNET, aber Bibliotheken
      # (Billing, Asset Delivery, ML Kit) können es beim Zusammenführen mitbringen. Geprüft wird
      # deshalb die gebaute APK.
      - name: Offline-Garantie (Berechtigungen der APK)
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::Die APK fordert android.permission.INTERNET an. Das Offline-Versprechen gilt so nicht. Quelle suchen (./gradlew :app:processDebugMainManifest, merged manifest) und entweder die Bibliothek ersetzen oder INTERNET per tools:node=\"remove\" entfernen und auf dem Gerät prüfen."
            exit 1
          fi

  spike:
    name: Spike-Harness (Baseline und Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baseline
        run: python spike/harness/baseline_search.py

      - name: Python-Tests (ohne Modell-Download)
        run: python -m unittest discover -s spike/harness -p "test_*.py" -v

  datenbank:
    name: Datenbank (SQL, Schema, Migration)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Läuft ohne Android: @Query, Volltextsuche und Migration 1->2 gegen echtes SQLite (FTS4).
      - name: Room-SQL prüfen
        run: python tools/check_room_sql.py
